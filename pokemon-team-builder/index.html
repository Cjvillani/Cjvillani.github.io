<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokemon Team Builder</title>
</head>
<body>
  <main style="max-width: 720px; margin: 24px auto; font-family: Arial, sans-serif;">
    <section style="border: 6px solid #d4a017; border-radius: 24px; padding: 20px; background: #e7f6ff;">
      <div style="background: white; border-radius: 18px; padding: 18px;">
        <div style="text-align:center;">
          <div style="font-size: 20px; margin-bottom: 6px;">Name or ID</div>
          <input id="query" type="text" placeholder="e.g. 25 or pikachu" style="padding: 6px; width: 220px;" />
          <button id="findBtn">Find</button>
          <div id="status" style="margin-top: 10px; color: #444; min-height: 20px;"></div>
        </div>

        <div style="display:flex; justify-content:center; margin-top: 14px;">
          <img id="pokeImg" alt="" style="width: 260px; height: 260px; object-fit: contain; display:none;" />
        </div>

        <div style="display:flex; justify-content:center; margin-top: 10px;">
          <audio id="pokeAudio" controls style="width: 420px; display:none;"></audio>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;">
          <select id="move1"></select>
          <select id="move2"></select>
          <select id="move3"></select>
          <select id="move4"></select>
        </div>

        <div style="text-align:center; margin-top: 14px;">
          <button id="addBtn" disabled>Add to Team</button>
        </div>

        <div style="margin-top: 14px;">
          <table id="teamTable" border="1" cellspacing="0" cellpadding="8" style="width:100%; border-collapse: collapse;">
            <thead>
              <tr>
                <th style="width: 120px;">Pokemon</th>
                <th>Moves</th>
                <th style="width: 120px;">Action</th>
              </tr>
            </thead>
            <tbody id="teamBody"></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
